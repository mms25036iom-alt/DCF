[project]
name = "researchdesk-ai"
version = "0.1.0"
description = "Real-data equity research with linked Excel DCF models and evidence-led PDF reports."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "pypdf==6.21.2",
  "uvicorn[standard]==0.53.0",
  "yfinance==1.7.0",
  "beautifulsoup4==4.15.0",
  "reportlab==5.1.0",
  "markdown-it-py==4.2.0",
  "cryptography==50.0.2",
  "certifi==2026.10.19",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.8"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
